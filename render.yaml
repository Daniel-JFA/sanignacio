services:
  - type: web
    name: san-ignacio-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: san-ignacio-db
          property: connectionString

databases:
  - name: san-ignacio-db
    databaseName: sanignacio
    user: sanignacio
    plan: free
